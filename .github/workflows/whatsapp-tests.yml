name: WhatsApp payload tests

on:
  push:
    branches: [feature/whatsapp-invio-manuale]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  payload-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntax check
        run: |
          php -l includes/whatsapp_payload.php
          php -l tests/whatsapp_payload_test.php
      - name: Test payload validation (no network or database)
        run: php tests/whatsapp_payload_test.php
