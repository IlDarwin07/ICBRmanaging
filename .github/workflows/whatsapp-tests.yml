name: WhatsApp tests

on:
  push:
    branches: [main, feature/whatsapp-invio-manuale, feature/whatsapp-admin-invio]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  payload-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql
          coverage: none
      - name: Syntax check
        run: |
          find includes public/impostazioni tests -name '*whatsapp*.php' -print0 | xargs -0 -n1 php -l
          php -l public/messaggi/index.php
      - name: Unit tests (no network or database)
        run: |
          php tests/whatsapp_payload_test.php
          php tests/whatsapp_config_test.php
          php tests/whatsapp_transport_test.php
      - name: Database and simulated dispatch tests (temporary MySQL only)
        env:
          ICBR_WA_DB_TEST: '1'
        run: |
          php tests/whatsapp_database_test.php
          php tests/whatsapp_dispatch_test.php
